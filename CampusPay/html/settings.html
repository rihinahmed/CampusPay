<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CampusPay | Portal Settings</title>
    <!-- Tailwind CSS with Forms and Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "secondary-fixed-dim": "#bec8c8",
                            "on-secondary": "#ffffff",
                            "surface-container": "#eeeef0",
                            "inverse-on-surface": "#f0f0f3",
                            "tertiary": "#5b3e00",
                            "error-container": "#ffdad6",
                            "inverse-primary": "#86d4d3",
                            "on-secondary-fixed": "#141d1e",
                            "tertiary-container": "#795400",
                            "on-error-container": "#93000a",
                            "on-surface": "#1a1c1e",
                            "surface-tint": "#096969",
                            "on-primary-fixed": "#002020",
                            "on-tertiary-container": "#ffcb72",
                            "primary": "#004c4c",
                            "surface-variant": "#e2e2e5",
                            "surface-container-lowest": "#ffffff",
                            "on-primary-container": "#93e1e0",
                            "on-error": "#ffffff",
                            "on-primary": "#ffffff",
                            "secondary-fixed": "#dae4e4",
                            "error": "#ba1a1a",
                            "on-tertiary-fixed-variant": "#5f4100",
                            "primary-fixed-dim": "#86d4d3",
                            "on-secondary-fixed-variant": "#3f4949",
                            "background": "#f9f9fc",
                            "secondary-container": "#d8e2e2",
                            "on-surface-variant": "#3f4948",
                            "on-background": "#1a1c1e",
                            "surface-container-high": "#e8e8ea",
                            "on-primary-fixed-variant": "#004f4f",
                            "surface-container-highest": "#e2e2e5",
                            "surface-container-low": "#f3f3f6",
                            "surface-dim": "#dadadc",
                            "tertiary-fixed-dim": "#ffba31",
                            "primary-container": "#006666",
                            "surface": "#f9f9fc",
                            "inverse-surface": "#2f3133",
                            "on-secondary-container": "#5b6465",
                            "secondary": "#566060",
                            "outline-variant": "#bec9c8",
                            "tertiary-fixed": "#ffdeab",
                            "surface-bright": "#f9f9fc",
                            "primary-fixed": "#a2f0ef",
                            "on-tertiary-fixed": "#271900",
                            "outline": "#6f7979",
                            "on-tertiary": "#ffffff"
                        },
                        "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                        },
                        "spacing": {
                            "container-margin": "24px",
                            "stack-md": "12px",
                            "stack-sm": "4px",
                            "base": "8px",
                            "gutter": "16px",
                            "stack-lg": "24px"
                        }
                    },
                },
            }
        } catch (_e) { }
    </script>

    <!-- Synchronize dark theme state immediately to avoid flashing -->
    <script>
        if (localStorage.getItem('campuspay-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body
    class="bg-background text-on-background min-h-screen dark:bg-[#121314] dark:text-[#e2e2e5] font-sans antialiased flex">

    <!-- Toast Notification Container -->
    <div id="toast-container"
        class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- SideNavBar (Desktop Only) -->
    <aside id="desktop-sidebar"
        class="fixed left-0 top-0 h-full hidden md:flex flex-col border-r border-outline-variant bg-surface-container-low dark:bg-[#151617] w-64 z-30">
        <!-- Brand Header (set dynamically in details) -->
        <div class="p-6 flex flex-col gap-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-on-primary">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-primary dark:text-[#86d4d3]">CampusPay</h2>
                    <p
                        class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold default-subtitle-slot">
                        Portal</p>
                </div>
            </div>
        </div>
        <nav id="desktop-nav" class="flex-1 mt-4 space-y-1">
            <!-- Dynamically populated links -->
        </nav>
        <div id="desktop-footer" class="p-4 border-t border-outline-variant dark:border-none">
            <!-- Dynamically populated settings/logout -->
        </div>
    </aside>

    <!-- Mobile Drawer Sidebar Overlay -->
    <div id="mobile-nav" class="fixed inset-0 z-50 overflow-hidden pointer-events-none hidden">
        <div id="mobile-nav-overlay"
            class="absolute inset-0 bg-black/50 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-auto">
        </div>
        <div id="mobile-drawer-content"
            class="absolute top-0 left-0 max-w-xs w-full h-full bg-white dark:bg-[#1b1c1d] border-r border-outline-variant dark:border-[#2d3135] shadow-2xl flex flex-col -translate-x-full pointer-events-auto transition-transform duration-300">
            <div class="p-6 border-b border-outline-variant dark:border-[#2d3135] flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary">
                        <span class="material-symbols-outlined text-[20px]">school</span>
                    </div>
                    <span class="text-title-lg font-black text-primary dark:text-[#86d4d3]">CampusPay</span>
                </div>
                <button id="mobile-menu-close-btn"
                    class="p-1 hover:bg-surface-container-high dark:hover:bg-[#2d3135] rounded-full transition-colors text-on-surface-variant">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <nav id="mobile-nav-links" class="flex-1 mt-4 space-y-1">
                <!-- Dynamically populated links -->
            </nav>
            <div id="mobile-footer" class="p-6 border-t border-outline-variant dark:border-[#2d3135] space-y-4">
                <!-- Dynamically populated bottom links -->
            </div>
        </div>
    </div>

    <!-- Main Section -->
    <main class="flex-1 md:ml-64 flex flex-col min-h-screen">
        <!-- Top Navigation Bar -->
        <header
            class="fixed top-0 right-0 left-0 md:left-64 h-16 bg-surface dark:bg-[#1a1c1e] z-20 flex justify-between items-center px-container-margin border-b border-outline-variant transition-colors duration-200">
            <div class="flex items-center gap-4">
                <button id="mobile-menu-btn"
                    class="md:hidden p-2 text-on-surface-variant dark:text-[#bec9c8] hover:bg-surface-container-high dark:hover:bg-[#2d3135] rounded-full transition-colors">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="text-title-lg text-on-surface dark:text-white font-bold select-none">Settings</h1>
            </div>

            <div class="flex items-center gap-4">
                <button id="theme-toggle"
                    class="p-2 text-on-surface-variant dark:text-[#bec8c8] hover:bg-surface-container-low dark:hover:bg-[#2d3135] rounded-full transition-colors"
                    title="Toggle Theme">
                    <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                    <span class="material-symbols-outlined hidden dark:inline">light_mode</span>
                </button>
            </div>
        </header>

        <!-- Dynamic Settings Content Grid -->
        <div class="flex-1 mt-16 p-6 md:p-8 max-w-4xl mx-auto w-full">
            <div
                class="bg-white dark:bg-[#1a1c1e] rounded-2xl border border-outline-variant dark:border-[#2d3135] p-6 md:p-8 shadow-sm">
                <!-- Dynamic Title & Header -->
                <div class="border-b border-outline-variant dark:border-[#2d3135] pb-6 mb-6">
                    <h2 id="settings-title" class="text-2xl font-extrabold text-on-surface dark:text-white">Portal
                        Configuration</h2>
                    <p id="settings-subtitle" class="text-sm text-on-surface-variant dark:text-gray-400 mt-1">Review and
                        update details matching your profile role.</p>
                </div>

                <!-- Form wrapper -->
                <form id="settings-form" class="space-y-6">
                    <!-- Dynamic fields will be injected here by settings.js -->
                    <div id="settings-fields" class="space-y-6"></div>

                    <!-- Footer Actions -->
                    <div class="flex justify-end gap-4 border-t border-outline-variant dark:border-[#2d3135] pt-6 mt-8">
                        <button type="button" id="settings-cancel"
                            class="px-6 py-2.5 rounded-xl border border-outline-variant dark:border-white/10 text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-[#2d3135] transition-all font-semibold text-sm">
                            Cancel
                        </button>
                        <button type="submit"
                            class="px-8 py-2.5 rounded-xl bg-primary text-on-primary hover:bg-[#003b3b] dark:bg-[#004f4f] dark:hover:bg-[#006666] transition-all font-semibold text-sm shadow-sm select-none">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/settings.js" defer></script>
</body>

</html>
